name: Preparing release APKs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  assemble-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    env:
      NIKNOLIG_RELEASE_CERT_SHA256: ${{ vars.NIKNOLIG_RELEASE_CERT_SHA256 }}
      NIKNOLIG_DEFENSE_RELEASE_CERT_SHA256: ${{ vars.NIKNOLIG_DEFENSE_RELEASE_CERT_SHA256 }}
    steps:
      - name: Require independently approved release fingerprints
        shell: bash
        run: |
          set -euo pipefail
          set +x
          require_fingerprint() {
            local fingerprint="${2//:/}"
            if [[ ! "$fingerprint" =~ ^[[:xdigit:]]{64}$ ]]; then
              echo "::error::Missing or invalid independently approved SHA-256 reference: $1"
              exit 1
            fi
          }
          require_fingerprint NIKNOLIG_RELEASE_CERT_SHA256 "$NIKNOLIG_RELEASE_CERT_SHA256"
          require_fingerprint NIKNOLIG_DEFENSE_RELEASE_CERT_SHA256 "$NIKNOLIG_DEFENSE_RELEASE_CERT_SHA256"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate and stage release keystores
        shell: bash
        env:
          NIKNOLIG_RELEASE_KEYSTORE_BASE64: ${{ secrets.NIKNOLIG_RELEASE_KEYSTORE_BASE64 }}
          NIKNOLIG_DEFENSE_RELEASE_KEYSTORE_BASE64: ${{ secrets.NIKNOLIG_DEFENSE_RELEASE_KEYSTORE_BASE64 }}
          NIKNOLIG_RELEASE_STORE_PASSWORD: ${{ secrets.NIKNOLIG_RELEASE_STORE_PASSWORD }}
          NIKNOLIG_RELEASE_KEY_PASSWORD: ${{ secrets.NIKNOLIG_RELEASE_KEY_PASSWORD }}
          NIKNOLIG_DEFENSE_RELEASE_STORE_PASSWORD: ${{ secrets.NIKNOLIG_DEFENSE_RELEASE_STORE_PASSWORD }}
          NIKNOLIG_DEFENSE_RELEASE_KEY_PASSWORD: ${{ secrets.NIKNOLIG_DEFENSE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          require_value() {
            if [[ -z "$2" ]]; then
              echo "::error::Required Actions secret is missing: $1"
              exit 1
            fi
          }
          require_keystore() {
            local name="$1"
            local value="$2"
            if [[ ! "$value" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || (( ${#value} % 4 != 0 )); then
              echo "::error::Actions secret $name must be a single-line, padded standard Base64 value"
              exit 1
            fi
          }

          require_value NIKNOLIG_RELEASE_KEYSTORE_BASE64 "$NIKNOLIG_RELEASE_KEYSTORE_BASE64"
          require_value NIKNOLIG_DEFENSE_RELEASE_KEYSTORE_BASE64 "$NIKNOLIG_DEFENSE_RELEASE_KEYSTORE_BASE64"
          require_value NIKNOLIG_RELEASE_STORE_PASSWORD "$NIKNOLIG_RELEASE_STORE_PASSWORD"
          require_value NIKNOLIG_RELEASE_KEY_PASSWORD "$NIKNOLIG_RELEASE_KEY_PASSWORD"
          require_value NIKNOLIG_DEFENSE_RELEASE_STORE_PASSWORD "$NIKNOLIG_DEFENSE_RELEASE_STORE_PASSWORD"
          require_value NIKNOLIG_DEFENSE_RELEASE_KEY_PASSWORD "$NIKNOLIG_DEFENSE_RELEASE_KEY_PASSWORD"
          require_keystore NIKNOLIG_RELEASE_KEYSTORE_BASE64 "$NIKNOLIG_RELEASE_KEYSTORE_BASE64"
          require_keystore NIKNOLIG_DEFENSE_RELEASE_KEYSTORE_BASE64 "$NIKNOLIG_DEFENSE_RELEASE_KEYSTORE_BASE64"

          keystore_dir="$RUNNER_TEMP/android-release"
          install -d -m 700 "$keystore_dir"
          printf '%s' "$NIKNOLIG_RELEASE_KEYSTORE_BASE64" |
            base64 --decode > "$keystore_dir/niknolig-release.p12"
          printf '%s' "$NIKNOLIG_DEFENSE_RELEASE_KEYSTORE_BASE64" |
            base64 --decode > "$keystore_dir/niknolig-defense-release.p12"
          test -s "$keystore_dir/niknolig-release.p12"
          test -s "$keystore_dir/niknolig-defense-release.p12"
          chmod 600 "$keystore_dir/"*.p12
          printf 'NIKNOLIG_RELEASE_STORE_FILE=%s\n' "$keystore_dir/niknolig-release.p12" >> "$GITHUB_ENV"
          printf 'NIKNOLIG_DEFENSE_RELEASE_STORE_FILE=%s\n' "$keystore_dir/niknolig-defense-release.p12" >> "$GITHUB_ENV"

      - name: Assemble both signed release APKs
        shell: bash
        env:
          NIKNOLIG_RELEASE_STORE_PASSWORD: ${{ secrets.NIKNOLIG_RELEASE_STORE_PASSWORD }}
          NIKNOLIG_RELEASE_KEY_ALIAS: niknolig
          NIKNOLIG_RELEASE_KEY_PASSWORD: ${{ secrets.NIKNOLIG_RELEASE_KEY_PASSWORD }}
          NIKNOLIG_DEFENSE_RELEASE_STORE_PASSWORD: ${{ secrets.NIKNOLIG_DEFENSE_RELEASE_STORE_PASSWORD }}
          NIKNOLIG_DEFENSE_RELEASE_KEY_ALIAS: niknolig-defense
          NIKNOLIG_DEFENSE_RELEASE_KEY_PASSWORD: ${{ secrets.NIKNOLIG_DEFENSE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :niknolig:assembleRelease :niknolig-defense:assembleRelease --no-daemon

      - name: Verify package identities and APK signatures
        shell: bash
        env:
          NIKNOLIG_RELEASE_STORE_PASSWORD: ${{ secrets.NIKNOLIG_RELEASE_STORE_PASSWORD }}
          NIKNOLIG_RELEASE_KEY_ALIAS: niknolig
          NIKNOLIG_DEFENSE_RELEASE_STORE_PASSWORD: ${{ secrets.NIKNOLIG_DEFENSE_RELEASE_STORE_PASSWORD }}
          NIKNOLIG_DEFENSE_RELEASE_KEY_ALIAS: niknolig-defense
        run: |
          set -euo pipefail
          set +x
          normalize_fingerprint() {
            local fingerprint
            fingerprint="$(printf '%s' "$1" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if [[ ! "$fingerprint" =~ ^[[:xdigit:]]{64}$ ]]; then
              echo "::error::Invalid SHA-256 certificate fingerprint for $2"
              exit 1
            fi
            printf '%s' "$fingerprint"
          }
          keystore_fingerprint() {
            local label="$1"
            local store_file="$2"
            local alias="$3"
            local password_env="$4"
            local fingerprint
            fingerprint="$(keytool -list -v -keystore "$store_file" -storetype PKCS12 \
              -alias "$alias" -storepass:env "$password_env" |
              awk '/^[[:space:]]*SHA256: / && !found { sub(/^[[:space:]]*SHA256: /, ""); print; found=1 }')"
            if [[ -z "$fingerprint" ]]; then
              echo "::error::Could not read the signing certificate SHA-256 fingerprint for $label keystore"
              exit 1
            fi
            normalize_fingerprint "$fingerprint" "$label keystore"
          }
          verify_apk() {
            local module="$1"
            local expected_id="$2"
            local label="$3"
            local store_file="$4"
            local alias="$5"
            local password_env="$6"
            local expected_sha256
            expected_sha256="$(normalize_fingerprint "$7" "$label approved reference")"
            local -a apks
            mapfile -t apks < <(find "apps/$module/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print)
            if [[ "${#apks[@]}" -ne 1 || ! -s "${apks[0]:-}" ]]; then
              echo "::error::Expected exactly one release APK for $module"
              exit 1
            fi
            local actual_id
            actual_id="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "${apks[0]}" |
              sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            if [[ "$actual_id" != "$expected_id" ]]; then
              echo "::error::Expected package $expected_id for $module but found $actual_id"
              exit 1
            fi
            local keystore_sha256
            keystore_sha256="$(keystore_fingerprint "$label" "$store_file" "$alias" "$password_env")"
            local signature_output
            signature_output="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "${apks[0]}")"
            local -a apk_fingerprints
            mapfile -t apk_fingerprints < <(printf '%s\n' "$signature_output" |
              sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: ([[:xdigit:]]{64})$/\1/p')
            if [[ "${#apk_fingerprints[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one APK signer certificate for $label"
              exit 1
            fi
            local apk_sha256
            apk_sha256="$(normalize_fingerprint "${apk_fingerprints[0]}" "$label APK")"
            printf '%s keystore certificate SHA-256: %s\n' "$label" "$keystore_sha256"
            printf '%s APK certificate SHA-256: %s\n' "$label" "$apk_sha256"
            if [[ "$keystore_sha256" != "$apk_sha256" ]]; then
              echo "$label certificate comparison: FAIL"
              exit 1
            fi
            echo "$label certificate comparison: PASS"
            if [[ "$keystore_sha256" != "$expected_sha256" ]]; then
              echo "::error::$label certificate does not match the independently approved SHA-256 reference"
              exit 1
            fi
            echo "$label approved certificate comparison: PASS"
          }

          verify_apk niknolig com.niknolig.app NIKNOLIG "$NIKNOLIG_RELEASE_STORE_FILE" \
            "$NIKNOLIG_RELEASE_KEY_ALIAS" NIKNOLIG_RELEASE_STORE_PASSWORD "$NIKNOLIG_RELEASE_CERT_SHA256"
          verify_apk niknolig-defense com.niknolig.defense "NIKNOLIG Defense" \
            "$NIKNOLIG_DEFENSE_RELEASE_STORE_FILE" "$NIKNOLIG_DEFENSE_RELEASE_KEY_ALIAS" \
            NIKNOLIG_DEFENSE_RELEASE_STORE_PASSWORD "$NIKNOLIG_DEFENSE_RELEASE_CERT_SHA256"

      - name: Upload NIKNOLIG release APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: niknolig-release-apk
          path: apps/niknolig/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload NIKNOLIG Defense release APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: niknolig-defense-release-apk
          path: apps/niknolig-defense/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary release keystores
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          keystore_dir="$RUNNER_TEMP/android-release"
          rm -f "$keystore_dir/niknolig-release.p12" "$keystore_dir/niknolig-defense-release.p12"
          rmdir "$keystore_dir" 2>/dev/null || true
