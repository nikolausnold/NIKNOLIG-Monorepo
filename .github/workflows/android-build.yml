name: Android apps build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NIKNOLIG_BACKEND_URL: ${{ vars.NIKNOLIG_BACKEND_URL }}
      NIKNOLIG_DEFENSE_BACKEND_URL: ${{ vars.NIKNOLIG_DEFENSE_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Assemble both debug APKs
        run: ./gradlew :niknolig:assembleDebug :niknolig-defense:assembleDebug --no-daemon
      - name: Test both backend health clients
        run: ./gradlew :electro-engel-core:test :niknolig:testDebugUnitTest :niknolig-defense:testDebugUnitTest --no-daemon
      - name: Preserve backend client test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-health-client-tests-${{ github.sha }}
          path: |
            apps/niknolig/build/test-results/testDebugUnitTest/*.xml
            apps/niknolig-defense/build/test-results/testDebugUnitTest/*.xml
            apps/niknolig/build/reports/tests/testDebugUnitTest/**
            apps/niknolig-defense/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
      - name: Verify package identities and APK signatures
        shell: bash
        run: |
          set -euo pipefail
          verify_apk() {
            local module="$1"
            local expected_id="$2"
            local apk
            apk="$(find "apps/$module/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -print -quit)"
            if [[ ! -s "$apk" ]]; then
              echo "::error::No debug APK found for $module"
              exit 1
            fi
            local actual_id
            actual_id="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" |
              sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            if [[ "$actual_id" != "$expected_id" ]]; then
              echo "::error::Expected $expected_id but found $actual_id in $apk"
              exit 1
            fi
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          }

          verify_apk niknolig com.niknolig.app
          verify_apk niknolig-defense com.niknolig.defense
      - name: Upload NIKNOLIG debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: niknolig-debug-apk
          path: apps/niknolig/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload NIKNOLIG Defense debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: niknolig-defense-debug-apk
          path: apps/niknolig-defense/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload release readiness report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-readiness-report
          path: docs/release-readiness.md
          if-no-files-found: error
          retention-days: 7

  electro-engel-ios-core:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test the portable iOS analysis core
        run: swift test --package-path modules/electro-engel/ios
