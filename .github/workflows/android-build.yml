name: Android apps build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run backend contract regression tests
        run: python3 -m unittest discover -s backend/tests
      - name: Run tooling regression tests
        run: python3 -m unittest discover -s tools/tests
      - name: Check registered system repositories
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.system_updates --output "$RUNNER_TEMP/system-update-report.json"
      - name: Upload system update report
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: system-update-report-${{ github.sha }}
          path: ${{ runner.temp }}/system-update-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Assemble both debug APKs
        run: ./gradlew :niknolig:assembleDebug :niknolig-defense:assembleDebug --no-daemon
      - name: Verify package identities and APK signatures
        shell: bash
        run: |
          set -euo pipefail
          verify_apk() {
            local module="$1"
            local expected_id="$2"
            local apk
            apk="$(find "apps/$module/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -print -quit)"
            if [[ ! -s "$apk" ]]; then
              echo "::error::No debug APK found for $module"
              exit 1
            fi
            local actual_id
            actual_id="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" |
              sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            if [[ "$actual_id" != "$expected_id" ]]; then
              echo "::error::Expected $expected_id but found $actual_id in $apk"
              exit 1
            fi
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          }

          verify_apk niknolig com.niknolig.app
          verify_apk niknolig-defense com.niknolig.defense
      - name: Upload NIKNOLIG debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: niknolig-debug-apk
          path: apps/niknolig/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload NIKNOLIG Defense debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: niknolig-defense-debug-apk
          path: apps/niknolig-defense/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload release readiness report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-readiness-report
          path: docs/release-readiness.md
          if-no-files-found: error
          retention-days: 7
      - name: Upload shared Android and iOS contract snapshot
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mobile-contracts-${{ github.sha }}
          path: |
            backend/openapi.yaml
            backend/contracts/*.json
            config/system-repositories.json
          if-no-files-found: error
          retention-days: 7
