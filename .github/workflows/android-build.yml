name: Android apps build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NIKNOLIG_BACKEND_URL: ${{ vars.NIKNOLIG_BACKEND_URL }}
      NIKNOLIG_DEFENSE_BACKEND_URL: ${{ vars.NIKNOLIG_DEFENSE_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Assemble both debug APKs
        run: ./gradlew :niknolig:assembleDebug :niknolig-defense:assembleDebug --no-daemon
      - name: Test both backend health clients
        run: ./gradlew :electro-engel-core:test :support-core:test :niknolig:testDebugUnitTest :niknolig-defense:testDebugUnitTest --no-daemon
      - name: Lint both Android apps
        run: ./gradlew :niknolig:lintDebug :niknolig-defense:lintDebug --no-daemon
      - name: Preserve Android lint evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-lint-${{ github.sha }}
          path: |
            apps/niknolig/build/reports/lint-results-debug.*
            apps/niknolig-defense/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve backend client test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-health-client-tests-${{ github.sha }}
          path: |
            apps/niknolig/build/test-results/testDebugUnitTest/*.xml
            apps/niknolig-defense/build/test-results/testDebugUnitTest/*.xml
            apps/niknolig/build/reports/tests/testDebugUnitTest/**
            apps/niknolig-defense/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
      - name: Verify package identities and APK signatures
        shell: bash
        run: |
          set -euo pipefail
          verify_apk() {
            local module="$1"
            local expected_id="$2"
            local apk
            apk="$(find "apps/$module/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -print -quit)"
            if [[ ! -s "$apk" ]]; then
              echo "::error::No debug APK found for $module"
              exit 1
            fi
            local actual_id
            actual_id="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" |
              sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            if [[ "$actual_id" != "$expected_id" ]]; then
              echo "::error::Expected $expected_id but found $actual_id in $apk"
              exit 1
            fi
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          }

          verify_apk niknolig com.niknolig.app
          verify_apk niknolig-defense com.niknolig.defense
      - name: Upload NIKNOLIG debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: niknolig-debug-apk
          path: apps/niknolig/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload NIKNOLIG Defense debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: niknolig-defense-debug-apk
          path: apps/niknolig-defense/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload release readiness report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-readiness-report
          path: docs/release-readiness.md
          if-no-files-found: error
          retention-days: 7

  android-17-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Add Android SDK tools to PATH
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [[ -z "$sdkmanager" ]]; then
            echo "::error::Android SDK command-line tools are missing from $ANDROID_HOME"
            exit 1
          fi
          sdk_tools="$(dirname "$sdkmanager")"
          test -x "$sdk_tools/avdmanager"
          echo "$sdk_tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_TOOLS=$sdk_tools" >> "$GITHUB_ENV"
      - name: Install Android 17 emulator image
        run: |
          yes 2>/dev/null | "$ANDROID_SDK_TOOLS/sdkmanager" --licenses >/dev/null
          set -o pipefail
          sdkmanager="$ANDROID_SDK_TOOLS/sdkmanager"
          "$sdkmanager" --list --channel=3 > "$RUNNER_TEMP/android-sdk-packages.txt"
          system_image="$(awk -F '|' '
            $1 ~ /^[[:space:]]*system-images;android-(37|CinnamonBun);.*;x86_64[[:space:]]*$/ {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)
              if ($1 ~ /google_apis/) {
                print $1
                found = 1
                exit
              }
              if (fallback == "") fallback = $1
            }
            END {
              if (!found && fallback != "") print fallback
            }
          ' "$RUNNER_TEMP/android-sdk-packages.txt")"
          if [[ -z "$system_image" ]]; then
            grep -E 'system-images;android-(37|CinnamonBun);' "$RUNNER_TEMP/android-sdk-packages.txt" || true
            echo "::error::No Android 17 x86_64 system image is available in SDK preview channel 3"
            exit 1
          fi
          echo "ANDROID_17_SYSTEM_IMAGE=$system_image" >> "$GITHUB_ENV"
          "$sdkmanager" --install --channel=3 \
            "emulator" "$system_image" \
            2>&1 | tee "$RUNNER_TEMP/android-sdk-install.log"
      - name: Start Android 17 emulator
        run: |
          set -euo pipefail
          echo no | avdmanager create avd --force \
            --name android-17-api-37 \
            --package "$ANDROID_17_SYSTEM_IMAGE" \
            --device pixel_2
          emulator -avd android-17-api-37 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 2048 \
            > "$RUNNER_TEMP/android-17-emulator.log" 2>&1 &
          timeout 120 adb wait-for-device
          timeout 240 bash -c \
            'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          test "$(adb shell getprop ro.build.version.sdk | tr -d "\r")" = "37"
      - name: Build smoke APKs with isolated HTTPS probe endpoint
        run: >-
          ./gradlew :niknolig:assembleDebug :niknolig-defense:assembleDebug
          -PniknoligDebugBackendUrl=https://127.0.0.1:18443
          -PniknoligDefenseDebugBackendUrl=https://127.0.0.1:18443 --no-daemon
      - name: Install both apps and exercise Android 17 flows
        run: |
          for module in niknolig niknolig-defense; do
            apk="$(find "apps/$module/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
            test -s "$apk"
            adb install -r "$apk"
          done
          adb reverse tcp:18443 tcp:18443
          python3 tools/android_emulator_smoke.py
      - name: Preserve Android 17 emulator diagnostics
        if: always()
        run: |
          if timeout 15 adb devices | grep -q '^emulator-'; then
            timeout 30 adb logcat -d -t 5000 > "$RUNNER_TEMP/android-17-logcat.txt" 2>/dev/null || true
            timeout 30 adb shell dumpsys activity activities > "$RUNNER_TEMP/android-17-activities.txt" 2>/dev/null || true
          fi
      - name: Upload Android 17 emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-17-emulator-${{ github.sha }}
          path: |
            ${{ runner.temp }}/android-sdk-packages.txt
            ${{ runner.temp }}/android-sdk-install.log
            ${{ runner.temp }}/android-17-emulator.log
            ${{ runner.temp }}/android-17-logcat.txt
            ${{ runner.temp }}/android-17-activities.txt
          if-no-files-found: warn
          retention-days: 7

  electro-engel-ios-core:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test the portable iOS analysis core
        run: swift test --package-path modules/electro-engel/ios
