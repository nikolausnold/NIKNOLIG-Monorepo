name: Android apps build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Build and verify signed release APKs (main branch only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Assemble both debug APKs
        run: ./gradlew :niknolig:assembleDebug :niknolig-defense:assembleDebug --no-daemon
      - name: Verify package identities and APK signatures
        shell: bash
        run: |
          set -euo pipefail
          verify_apk() {
            local module="$1"
            local expected_id="$2"
            local apk
            apk="$(find "apps/$module/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -print -quit)"
            if [[ ! -s "$apk" ]]; then
              echo "::error::No debug APK found for $module"
              exit 1
            fi
            local actual_id
            actual_id="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" |
              sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            if [[ "$actual_id" != "$expected_id" ]]; then
              echo "::error::Expected $expected_id but found $actual_id in $apk"
              exit 1
            fi
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          }

          verify_apk niknolig com.niknolig.app
          verify_apk niknolig-defense com.niknolig.defense
      - name: Upload NIKNOLIG debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: niknolig-debug-apk
          path: apps/niknolig/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload NIKNOLIG Defense debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: niknolig-defense-debug-apk
          path: apps/niknolig-defense/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  assemble-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_candidate && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare release keystores
        shell: bash
        env:
          NIKNOLIG_RELEASE_KEYSTORE_BASE64: ${{ secrets.NIKNOLIG_RELEASE_KEYSTORE_BASE64 }}
          NIKNOLIG_RELEASE_STORE_PASSWORD: ${{ secrets.NIKNOLIG_RELEASE_STORE_PASSWORD }}
          NIKNOLIG_RELEASE_KEY_ALIAS: ${{ secrets.NIKNOLIG_RELEASE_KEY_ALIAS }}
          NIKNOLIG_RELEASE_KEY_PASSWORD: ${{ secrets.NIKNOLIG_RELEASE_KEY_PASSWORD }}
          NIKNOLIG_DEFENSE_RELEASE_KEYSTORE_BASE64: ${{ secrets.NIKNOLIG_DEFENSE_RELEASE_KEYSTORE_BASE64 }}
          NIKNOLIG_DEFENSE_RELEASE_STORE_PASSWORD: ${{ secrets.NIKNOLIG_DEFENSE_RELEASE_STORE_PASSWORD }}
          NIKNOLIG_DEFENSE_RELEASE_KEY_ALIAS: ${{ secrets.NIKNOLIG_DEFENSE_RELEASE_KEY_ALIAS }}
          NIKNOLIG_DEFENSE_RELEASE_KEY_PASSWORD: ${{ secrets.NIKNOLIG_DEFENSE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            NIKNOLIG_RELEASE_KEYSTORE_BASE64 \
            NIKNOLIG_RELEASE_STORE_PASSWORD \
            NIKNOLIG_RELEASE_KEY_ALIAS \
            NIKNOLIG_RELEASE_KEY_PASSWORD \
            NIKNOLIG_DEFENSE_RELEASE_KEYSTORE_BASE64 \
            NIKNOLIG_DEFENSE_RELEASE_STORE_PASSWORD \
            NIKNOLIG_DEFENSE_RELEASE_KEY_ALIAS \
            NIKNOLIG_DEFENSE_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub secret $name is not configured."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$NIKNOLIG_RELEASE_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/niknolig-release.jks"
          printf '%s' "$NIKNOLIG_DEFENSE_RELEASE_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/niknolig-defense-release.jks"
          test -s "$RUNNER_TEMP/niknolig-release.jks"
          test -s "$RUNNER_TEMP/niknolig-defense-release.jks"
      - name: Assemble signed release APKs
        env:
          NIKNOLIG_RELEASE_STORE_FILE: ${{ runner.temp }}/niknolig-release.jks
          NIKNOLIG_RELEASE_STORE_PASSWORD: ${{ secrets.NIKNOLIG_RELEASE_STORE_PASSWORD }}
          NIKNOLIG_RELEASE_KEY_ALIAS: ${{ secrets.NIKNOLIG_RELEASE_KEY_ALIAS }}
          NIKNOLIG_RELEASE_KEY_PASSWORD: ${{ secrets.NIKNOLIG_RELEASE_KEY_PASSWORD }}
          NIKNOLIG_DEFENSE_RELEASE_STORE_FILE: ${{ runner.temp }}/niknolig-defense-release.jks
          NIKNOLIG_DEFENSE_RELEASE_STORE_PASSWORD: ${{ secrets.NIKNOLIG_DEFENSE_RELEASE_STORE_PASSWORD }}
          NIKNOLIG_DEFENSE_RELEASE_KEY_ALIAS: ${{ secrets.NIKNOLIG_DEFENSE_RELEASE_KEY_ALIAS }}
          NIKNOLIG_DEFENSE_RELEASE_KEY_PASSWORD: ${{ secrets.NIKNOLIG_DEFENSE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :niknolig:assembleRelease :niknolig-defense:assembleRelease --no-daemon
      - name: Verify release package identities and signatures
        shell: bash
        run: |
          set -euo pipefail
          verify_apk() {
            local module="$1"
            local expected_id="$2"
            local apk
            apk="$(find "apps/$module/build/outputs/apk/release" -maxdepth 1 -name '*.apk' -print -quit)"
            if [[ ! -s "$apk" ]]; then
              echo "::error::No release APK found for $module"
              exit 1
            fi
            local actual_id
            actual_id="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" |
              sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            if [[ "$actual_id" != "$expected_id" ]]; then
              echo "::error::Unexpected package identity in release APK for $module"
              exit 1
            fi
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          }

          verify_apk niknolig com.niknolig.app
          verify_apk niknolig-defense com.niknolig.defense
      - name: Upload NIKNOLIG release APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: niknolig-release-apk
          path: apps/niknolig/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload NIKNOLIG Defense release APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: niknolig-defense-release-apk
          path: apps/niknolig-defense/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
