name: Android apps build

on:
  push:
    paths:
      - "apps/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/android-release.yml"
  pull_request:
    paths:
      - "apps/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Test, lint and assemble both debug APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :niknolig:testDebugUnitTest :niknolig-defense:testDebugUnitTest \
            :niknolig:lintDebug :niknolig-defense:lintDebug \
            :niknolig:assembleDebug :niknolig-defense:assembleDebug \
            --no-daemon --continue 2>&1 | tee "$RUNNER_TEMP/android-debug-build.log"
      - name: Upload Android diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-debug-build.log
            apps/niknolig/build/reports/
            apps/niknolig-defense/build/reports/
            apps/niknolig/build/test-results/
            apps/niknolig-defense/build/test-results/
            apps/niknolig/build/intermediates/lint_intermediate_text_report/
            apps/niknolig-defense/build/intermediates/lint_intermediate_text_report/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify package identities and APK signatures
        shell: bash
        run: |
          set -euo pipefail
          verify_apk() {
            local module="$1"
            local expected_id="$2"
            local apk
            apk="$(find "apps/$module/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -print -quit)"
            if [[ ! -s "$apk" ]]; then
              echo "::error::No debug APK found for $module"
              exit 1
            fi
            local actual_id
            actual_id="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" |
              sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            if [[ "$actual_id" != "$expected_id" ]]; then
              echo "::error::Expected $expected_id but found $actual_id in $apk"
              exit 1
            fi
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          }

          verify_apk niknolig com.niknolig.app
          verify_apk niknolig-defense com.niknolig.defense
      - name: Upload NIKNOLIG debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: niknolig-debug-apk
          path: apps/niknolig/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload NIKNOLIG Defense debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: niknolig-defense-debug-apk
          path: apps/niknolig-defense/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload release readiness report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-readiness-report
          path: docs/release-readiness.md
          if-no-files-found: error
          retention-days: 7
