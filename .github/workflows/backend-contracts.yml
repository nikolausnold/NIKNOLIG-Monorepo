name: Backend contracts and tooling

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_DB: ci_backend_test
          POSTGRES_PASSWORD: ci-only-disposable
        ports:
          - 127.0.0.1:54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_backend_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned backend runtime dependencies
        run: python3 -m pip install -r backend/requirements.txt
      - name: Run backend contract regression tests
        env:
          BACKEND_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:54329/ci_backend_test
          PGPASSWORD: ci-only-disposable
        run: python3 -m unittest discover -s backend/tests
      - name: Run tooling regression tests
        run: python3 -m unittest discover -s tools/tests
      - name: Check registered system repositories
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.system_updates --output "$RUNNER_TEMP/system-update-report.json"
      - name: Upload system update report
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: system-update-report-${{ github.sha }}
          path: ${{ runner.temp }}/system-update-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload shared mobile contract snapshot
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mobile-contracts-${{ github.sha }}
          path: |
            backend/openapi.yaml
            backend/contracts/*.json
            config/system-repositories.json
          if-no-files-found: error
          retention-days: 7
