name: Read-only Workers repository audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-read-only-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this repository without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Inspect the existing Workers source without executing it
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE" "$GITHUB_STEP_SUMMARY" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          summary = Path(sys.argv[2])
          worker = root / "workers" / "openai-gateway"
          if not worker.is_dir():
              raise SystemExit("The in-repository workers/openai-gateway source was not found.")

          ignored = {".git", "node_modules", "vendor", "dist", "build"}
          files = []
          for current, dirs, names in os.walk(worker):
              dirs[:] = sorted(name for name in dirs if name not in ignored)
              files.extend(Path(current, name).relative_to(root).as_posix() for name in names)
          files.sort()

          credential_patterns = (
              re.compile(r"\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})\b"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"""(?i)\b(?:token|password|secret|api[_-]?key)\s*[:=]\s*['"][^'"]{8,}['"]"""),
          )
          credential_like = False
          for relative in files:
              path = root / relative
              if path.is_symlink() or path.stat().st_size > 1_000_000:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if any(pattern.search(content) for pattern in credential_patterns):
                  credential_like = True
                  break

          workflows = sorted(
              path.relative_to(root).as_posix()
              for path in (root / ".github" / "workflows").glob("*")
              if path.is_file() and path.suffix.lower() in {".yml", ".yaml"}
          )
          lines = [
              "# Read-only Workers repository audit",
              "",
              "- Source inspected: `workers/openai-gateway/` in this repository",
              f"- Worker files inspected: {len(files)}",
              f"- Worker configuration present: {'yes' if (worker / 'wrangler.toml').is_file() else 'no'}",
              f"- Worker entry point present: {'yes' if (worker / 'src' / 'index.mjs').is_file() else 'no'}",
              f"- Credential-like patterns: {'detected; review privately' if credential_like else 'none detected by basic pattern scan'}",
              "",
              "## Repository workflows",
          ]
          lines.extend(f"- `{name}`" for name in workflows)
          if not workflows:
              lines.append("- None found.")
          lines.extend([
              "",
              "No source content or credential values are included in this report. "
              "The in-repository Worker was inspected read-only; its code was not executed or deployed.",
          ])
          with summary.open("a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
          PY
