services:
  api:
    profiles: ["api"]
    build:
      context: .
    environment:
      BACKEND_API_ENABLED: ${BACKEND_API_ENABLED:-false}
      BACKEND_ALLOW_INSECURE_LOCAL: "true"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-niknolig_local}
      PGUSER: ${BACKEND_DB_USER:-}
      PGPASSWORD: ${BACKEND_DB_PASSWORD:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE_NIKNOLIG: ${AUTH_AUDIENCE_NIKNOLIG:-}
      AUTH_AUDIENCE_DEFENSE: ${AUTH_AUDIENCE_DEFENSE:-}
      AUTH_PUBLIC_KEY_FILE: /run/auth/issuer-public.pem
    volumes:
      - type: bind
        source: ${AUTH_PUBLIC_KEY_FILE:-/dev/null}
        target: /run/auth/issuer-public.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      backend-internal: {}
      api-edge:
        gw_priority: 1
        priority: 1000
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-niknolig_local}
      POSTGRES_USER: ${POSTGRES_USER:-niknolig_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - backend-internal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  api-edge:
  backend-internal:
    internal: true

volumes:
  postgres-data:
