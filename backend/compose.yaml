services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-niknolig_local}
      POSTGRES_USER: ${POSTGRES_USER:-niknolig_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - backend-internal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  backend-internal:
    internal: true

volumes:
  postgres-data:
