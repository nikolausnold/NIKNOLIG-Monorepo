[project]
name = "nold-backend"
version = "0.1.0"
description = "Local health-only FastAPI runtime; not approved for production"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.2",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "rfc3339-validator==0.1.4",
]
