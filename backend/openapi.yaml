openapi: 3.1.0
info:
  title: NIKNOLIG Shared Backend Contract
  version: 0.1.0
  description: >-
    Contract-first proposal. Health operations and a minimal Supabase JWT-backed
    session check are implemented locally; no operational app, device, profile,
    or pairing API is approved. Production integration is blocked pending
    SecurityChain-P0 and product/security review.
servers:
  - url: https://backend.invalid
    description: Placeholder only; not a deployed or approved endpoint.
tags:
  - name: Health
    description: Non-sensitive process and dependency health contract.
  - name: Authentication
    description: Locally configurable Supabase JWT session verification.
paths:
  /v1/session:
    get:
      operationId: getAuthenticatedSession
      tags: [Authentication]
      summary: Verify the caller's access token and app-area assignment.
      security:
        - AccessToken: []
      responses:
        "200":
          description: The token is valid for this backend app area.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authenticated, appArea]
                properties:
                  authenticated:
                    type: boolean
                    const: true
                  appArea:
                    type: string
                    enum: [niknolig, niknolig-defense]
        "401":
          description: The token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The token belongs to the other app area.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Auth configuration or its JWKS service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Report process liveness.
      security: []
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: live
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Report readiness without exposing dependency details.
      security: []
      responses:
        "200":
          description: Required dependencies are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ready
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Service is temporarily unavailable.
                  requestId: 00000000-0000-4000-8000-000000000000
components:
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT is verified against the configured Supabase JWKS, issuer, and audience.
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live, ready]
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              maxLength: 200
            requestId:
              type: string
              format: uuid
    ErrorCode:
      type: string
      description: Stable machine-readable codes reserved for API implementations.
      enum:
        - AUTHENTICATION_REQUIRED
        - AUTHENTICATION_INVALID
        - AUTHORIZATION_DENIED
        - APP_AREA_MISMATCH
        - DEVICE_IDENTITY_UNVERIFIED
        - PAIRING_REQUIRED
        - PAIRING_EXPIRED
        - REPLAY_DETECTED
        - VALIDATION_FAILED
        - RATE_LIMITED
        - CONFLICT
        - NOT_FOUND
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
