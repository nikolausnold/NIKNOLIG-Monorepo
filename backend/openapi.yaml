openapi: 3.1.0
info:
  title: NIKNOLIG Shared Backend Contract
  version: 0.1.0
  description: >-
    Public health operations and a static project catalog for the existing API.
    No operational app, device, profile, or pairing API is implemented or
    approved. Protected product integration remains blocked pending
    SecurityChain-P0 and product/security review.
servers:
  - url: https://api.niknolig.com
    description: Operator-specified existing API; availability is checked separately.
tags:
  - name: Health
    description: Non-sensitive process and dependency health contract.
paths:
  /health:
    get:
      operationId: getApiHealth
      tags: [Health]
      summary: Report API process metadata, not database or product readiness.
      security: []
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service, version]
                properties:
                  status:
                    const: ok
                  service:
                    const: NOLD API
                  version:
                    const: 0.2.0
  /projects:
    get:
      operationId: getProjectCatalog
      tags: [Health]
      summary: List static project identifiers, without authorization or upstream checks.
      security: []
      responses:
        "200":
          description: Metadata only; not evidence that project services are available.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [projects]
                properties:
                  projects:
                    type: array
                    minItems: 3
                    maxItems: 3
                    uniqueItems: true
                    items:
                      type: string
                      enum: [niknolig, defense, monorepo]
  /db/health:
    get:
      operationId: getDatabaseConnectivity
      tags: [Health]
      summary: Execute SELECT 1 using the bounded read-only database connection.
      description: Does not verify migration invariants; use /health/ready for readiness.
      security: []
      responses:
        "200":
          description: PostgreSQL answered the connectivity probe.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service]
                properties:
                  status:
                    const: ok
                  service:
                    const: NOLD PostgreSQL
        "503":
          description: Connectivity failed; the legacy format exposes no connection details.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [detail]
                properties:
                  detail:
                    const: database_unavailable
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Report process liveness.
      security: []
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: live
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Report readiness without exposing dependency details.
      security: []
      responses:
        "200":
          description: Required dependencies are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ready
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Service is temporarily unavailable.
                  requestId: 00000000-0000-4000-8000-000000000000
components:
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Reserved contract requirement for future protected operations only.
        No issuer, token issuance, validation, or protected operation is
        specified or implemented by this contract.
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live, ready]
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              maxLength: 200
            requestId:
              type: string
              format: uuid
    ErrorCode:
      type: string
      description: Stable machine-readable codes reserved for API implementations.
      enum:
        - AUTHENTICATION_REQUIRED
        - AUTHENTICATION_INVALID
        - AUTHORIZATION_DENIED
        - APP_AREA_MISMATCH
        - DEVICE_IDENTITY_UNVERIFIED
        - PAIRING_REQUIRED
        - PAIRING_EXPIRED
        - REPLAY_DETECTED
        - VALIDATION_FAILED
        - RATE_LIMITED
        - CONFLICT
        - NOT_FOUND
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
