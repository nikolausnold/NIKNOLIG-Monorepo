openapi: 3.1.0
info:
  title: NIKNOLIG Shared Backend Contract
  version: 0.1.0
  description: >-
    Public health and service metadata contract; no operational
    app, device, profile, or pairing API is implemented or approved. Production
    data integration is blocked pending SecurityChain-P0 and product/security review.
servers:
  - url: https://api.niknolig.com
    description: Public health origin confirmed by the operator; no product API approval.
tags:
  - name: Health
    description: Non-sensitive process and dependency health contract.
  - name: Metadata
    description: Static service metadata, not app identity or authorization scopes.
paths:
  /health:
    get:
      operationId: getServiceMetadata
      tags: [Metadata]
      summary: Report static process metadata without checking dependencies.
      security: []
      responses:
        "200":
          description: Static API metadata; not readiness or product availability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceMetadata"
  /projects:
    get:
      operationId: getProjectNames
      tags: [Metadata]
      summary: List static project labels, not authenticated app scopes.
      security: []
      responses:
        "200":
          description: Static project labels; defense is not an authorization scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectNames"
  /db/health:
    get:
      operationId: getDatabaseConnectivity
      tags: [Health]
      summary: Check database connectivity, not schema readiness.
      security: []
      responses:
        "200":
          description: Database accepted a connectivity query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseHealth"
        "503":
          description: Database connectivity check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseUnavailable"
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Report process liveness.
      security: []
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessStatus"
              example:
                status: live
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Report readiness without exposing dependency details.
      security: []
      responses:
        "200":
          description: Required dependencies are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
              example:
                status: ready
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Service is temporarily unavailable.
                  requestId: 00000000-0000-4000-8000-000000000000
components:
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Reserved contract requirement for future protected operations only.
        No issuer, token issuance, validation, or protected operation is
        specified or implemented by this contract.
  schemas:
    ServiceMetadata:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          const: ok
        service:
          const: NOLD API
        version:
          const: 0.2.0
    ProjectNames:
      type: object
      additionalProperties: false
      required: [projects]
      properties:
        projects:
          type: array
          const: [niknolig, defense, monorepo]
    DatabaseHealth:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          const: ok
        service:
          const: NOLD PostgreSQL
    DatabaseUnavailable:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          const: database_unavailable
    LivenessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: live
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ready
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              maxLength: 200
            requestId:
              type: string
              format: uuid
    ErrorCode:
      type: string
      description: Stable machine-readable codes reserved for API implementations.
      enum:
        - AUTHENTICATION_REQUIRED
        - AUTHENTICATION_INVALID
        - AUTHORIZATION_DENIED
        - APP_AREA_MISMATCH
        - DEVICE_IDENTITY_UNVERIFIED
        - PAIRING_REQUIRED
        - PAIRING_EXPIRED
        - REPLAY_DETECTED
        - VALIDATION_FAILED
        - RATE_LIMITED
        - CONFLICT
        - NOT_FOUND
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
